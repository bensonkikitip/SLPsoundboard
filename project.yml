name: SceneTalk
options:
  bundleIdPrefix: com.scenetalk
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SceneTalk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SceneTalk
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scenetalk.app
        INFOPLIST_FILE: Sources/SceneTalk/Info.plist
        DEVELOPMENT_TEAM: ""             # set when signing
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required usage descriptions (populated for capabilities we need)
        NSMicrophoneUsageDescription: "SceneTalk records short voice clips so patients hear familiar voices when they tap objects."
        NSPhotoLibraryUsageDescription: "SceneTalk uses your photo library to set background scenes and create object cutouts."
        NSCameraUsageDescription: "SceneTalk uses the camera to photograph backgrounds and objects for new scenes."
    entitlements:
      path: Sources/SceneTalk/SceneTalk.entitlements
    dependencies: []

  SceneTalkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SceneTalkTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scenetalk.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SceneTalk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SceneTalk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SceneTalk

schemes:
  SceneTalk:
    build:
      targets:
        SceneTalk: all
        SceneTalkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SceneTalkTests
      coverageTargets:
        - SceneTalk
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug": "1"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
